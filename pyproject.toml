[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-mean-filter"
version = "0.1.0"
description = "CLI em Python para calcular a média de colunas CSV com filtros dinâmicos, zero dependências e 36 testes unitários."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "jjuffagtotal-source"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
csv-mean = "analise:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/analise.py"]
sources = ["src"]
